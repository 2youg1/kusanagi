[package]
name = "kusanagi-site"
description = "What one endpoint keeps on its own disk: an identity, one file per channel, and the invitations that open them."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
kusanagi-kernel.workspace = true
kusanagi-chain.workspace = true
kusanagi-grant.workspace = true
kusanagi-seal.workspace = true
# The keyed hash that files a channel under something other than its name.
blake3.workspace = true
thiserror.workspace = true
# Erasure for the identity seed on its way into an archive.
zeroize.workspace = true

# The access list every site file is created with. Microsoft's own binding, so
# the vendor count does not move; `site::permissions::windows` is the only module
# that touches it, and the only module in this workspace with `unsafe` in it.
[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
] }

[dev-dependencies]
proptest.workspace = true

[lints]
workspace = true
