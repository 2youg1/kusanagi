# The clock is sampled at exactly one point: `kusanagi::assembly`.
# Anything else that reads the clock makes a run irreproducible, so the call is denied
# and the time must arrive as a parameter.
disallowed-methods = [
    { path = "std::time::SystemTime::now", reason = "take the time as a parameter; the single sampling point is kusanagi::assembly" },
    { path = "std::time::Instant::now", reason = "take the time as a parameter; the single sampling point is kusanagi::assembly" },
]
