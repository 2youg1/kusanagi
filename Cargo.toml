[workspace]
resolver = "3"
members = [
    "crates/kernel",
    "crates/chain",
    "crates/seal",
    "crates/grant",
    "crates/waypoint",
    "crates/box",
    "crates/site",
    "crates/kusanagi",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.97"
license = "MPL-2.0"
repository = "https://github.com/2youg1/kusanagi"
authors = ["2youg1 and the kusanagi contributors"]

[workspace.dependencies]
kusanagi-kernel = { path = "crates/kernel", version = "0.0.1" }
kusanagi-chain = { path = "crates/chain", version = "0.0.1" }
kusanagi-waypoint = { path = "crates/waypoint", version = "0.0.1" }
kusanagi-box = { path = "crates/box", version = "0.0.1" }
kusanagi-seal = { path = "crates/seal", version = "0.0.1" }
kusanagi-grant = { path = "crates/grant", version = "0.0.1" }
kusanagi-site = { path = "crates/site", version = "0.0.1" }
blake3 = { version = "1.8", default-features = false, features = ["std"] }
thiserror = "2"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The signature scheme, ML-DSA-87 (FIPS 204). Pure Rust with no C toolchain,
# which `kernel-SPEC.md` §13 requires of anything that signs here.
fips204 = { version = "0.4.6", default-features = false, features = [
    "ml-dsa-87",
] }
chacha20poly1305 = { version = "0.10", default-features = false, features = [
    "alloc",
] }
# Erasure and constant-time equality, both taken directly. They arrived in the
# tree under `ed25519-dalek` and stayed when it left: `fips204` zeroizes its own
# key material but exposes nothing to reach the channel secret, the stream, the
# per-drop key or a fixed-width identifier, and those are what these two cover.
zeroize = { version = "1", features = ["derive"] }
subtle = { version = "2", default-features = false }
getrandom = "0.3"
hmac = "0.12"
sha2 = "0.10"
ureq = { version = "3", default-features = false, features = ["rustls"] }
proptest = "1"

# The production allowlist for lint suppression (rust-hardening §"allow/expect policy").
# A `#[expect]` in non-test code is permitted ONLY for a lint named here:
#
#   clippy::disallowed_methods — at exactly one function, `kusanagi::world::sample`.
#   clippy::large_enum_variant — at exactly one type, `kernel::Link`, whose two
#     shapes differ by an ML-DSA-87 signature. Boxing it would cost `Copy`, which
#     every `const fn` accessor on `Segment` relies on.
#     AGENTS.md already rules that "the single sampling point is
#     `kusanagi::world::sample`", which `kusanagi::assembly` calls once per command
#     and then passes down as a value; clippy.toml denies the clock everywhere so
#     that the ruling is machine-held.
#     The program still has to read the clock once, and the suppression marks the site
#     the ruling designates. It is not an exception to the policy; it is the policy's
#     one address. Any second site is a review failure.
#
# Adding a row to this list requires an explicit ruling recorded as a `Verdict:` trailer.
[workspace.lints.rust]
warnings = "deny"
unsafe_code = "forbid"
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"
# `kani` is a real configuration this workspace compiles under; the proof harness
# in `kusanagi-grant` lives behind it. Declaring it here is what keeps the cfg
# check on for every name that is *not* declared.
unexpected_cfgs = { level = "deny", check-cfg = ['cfg(kani)'] }

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"
string_slice = "deny"
unwrap_in_result = "deny"
arithmetic_side_effects = "deny"
let_underscore_must_use = "deny"
as_conversions = "deny"
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_sign_loss = "deny"
cast_lossless = "warn"
float_cmp = "deny"
lossy_float_literal = "deny"
# `allow_attributes` is deliberately off. It exists to push `#[allow]` toward the
# self-cleaning `#[expect]`, which is right for a single production suppression and
# wrong for a test module: the set of lints a `mod tests` trips changes every time a
# test is added, so `#[expect]` there is not self-cleaning but self-churning.
# The gate that actually enforces the policy is the next line — no suppression
# compiles without a written reason — plus the one-entry production allowlist
# above.
allow_attributes = "allow"
allow_attributes_without_reason = "deny"
pedantic = { level = "warn", priority = -1 }

[profile.dev]
overflow-checks = true

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
strip = "symbols"
