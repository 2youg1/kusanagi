# What watches for the world changing underneath this repository.
#
# Everything here is red for a third reason, and it is the reason the other two
# lanes cannot cover: **nothing in the tree changed, and it broke anyway.** A
# runner image drops a PowerShell module, an action publishes a new major, a
# hosted network stops resolving something, a counterexample hunter finds a case
# that was always reachable and never drawn. None of that is anybody's change,
# so none of it may block a merge or a tag.
#
# **A red run here would be ignored within a week**, which is why a failure opens
# an issue instead. One issue per subject: a lane that has been red for a month
# gets comments on the issue somebody already owns rather than a fresh
# notification every morning, and a lane that has just gone red gets something
# with a title, an assignee and a close button.
name: sentinel

on:
  schedule:
    - cron: "41 4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # The counterexample hunter. It never gates a change — if it did, every Rust
  # contributor would need a second toolchain to merge anything — so it lives
  # here, where a finding pages somebody without standing in a queue.
  #
  # `lean-action` installs the toolchain named in `adversary/lean-toolchain`.
  # The suite takes no dependency outside that toolchain, so there is no
  # registry to reach and nothing to resolve.
  adversary:
    runs-on: ubuntu-latest
    env:
      KUSANAGI_BIN: ${{ github.workspace }}/target/release/kusanagi
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: build what the adversary drives
        run: cargo build --release
      - name: hunt
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: adversary
          build: "true"
          test: "true"

  # The gate, re-run against code that has not moved. A failure here means the
  # ground moved: this is the only job in the repository whose red is *always*
  # about the environment, because the input is identical to the last green run.
  unchanged:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: taiki-e/install-action@nextest
      - name: lint
        run: cargo clippy --all-targets --all-features -- -D warnings
        env:
          RUSTFLAGS: -D warnings
      - name: test
        run: cargo nextest run --workspace --all-features -E 'not package(kusanagi-grant)'

  report:
    needs: [adversary, unchanged]
    if: always() && (needs.adversary.result == 'failure' || needs.unchanged.result == 'failure')
    runs-on: ubuntu-latest
    steps:
      - name: open or update the issue for this lane
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          HUNTER: ${{ needs.adversary.result }}
          GROUND: ${{ needs.unchanged.result }}
        run: |
          title="sentinel: the daily watch is red"
          body=$(printf 'The scheduled lane failed against code nobody changed.\n\n- counterexample hunter: %s\n- the gate on unchanged code: %s\n\n%s\n\nThis issue is updated rather than reopened, so its comment history is how long the lane has been red.' "$HUNTER" "$GROUND" "$RUN")
          existing=$(gh issue list --repo "$REPO" --state open --search "$title in:title" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$REPO" --body "$body"
          else
            gh issue create --repo "$REPO" --title "$title" --body "$body"
          fi
