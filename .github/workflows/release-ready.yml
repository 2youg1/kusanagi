# Whether `main` can be tagged.
#
# Everything here is red for one reason: **what we would ship is not what we say
# we ship.** None of it blocks a merge, because none of it is about the change
# somebody just made — a contributor fixing a typo in Rust cannot be asked to
# own a GUI toolchain, a Nix evaluation, or a second machine's idea of a
# reproducible build. What it is about is the artefact.
#
# `AGENTS.md` says no tag goes out before this lane is green. That rule is only
# worth having if the lane can actually be green, which is why the things that
# cannot — the environment watchers — are in `sentinel.yml` instead.
name: release-ready

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # The third platform. It is not in the gate because macOS runners are the
  # slowest thing in this repository and a reviewer waits on the gate.
  check-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - name: lint
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: test
        run: cargo nextest run --workspace --all-features -E 'not package(kusanagi-grant)'

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  # A build that is reproducible on one machine is deterministic; a build that is
  # reproducible on two is the claim `docs/VERIFY.md` makes. This is the second
  # machine, and it is not one anybody here controls.
  reproducible:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: build twice and compare
        shell: bash
        run: |
          export RUSTFLAGS="$(bash scripts/hermetic.sh)"
          built() {
            cargo build --release --locked --message-format json 2>/dev/null \
              | grep -o '"executable":"[^"]*kusanagi[^"]*"' | tail -1 | cut -d'"' -f4
          }
          cargo build --release --locked --quiet
          first=$(sha256sum "$(built)" | cut -d' ' -f1 | tr -d '\')
          touch crates/kusanagi/src/main.rs
          cargo build --release --locked --quiet
          second=$(sha256sum "$(built)" | cut -d' ' -f1 | tr -d '\')
          echo "first  $first"
          echo "second $second"
          [ "$first" = "$second" ] || { echo "::error::two builds of one source differ"; exit 1; }
          # And nothing about this runner reached the bytes: no home directory,
          # no checkout path. A binary that names where it was built names who
          # built it, on a developer's machine.
          if grep -aq "$(cygpath -w "$HOME" 2>/dev/null || echo "$HOME")" "$(built)"; then
            echo "::error::the binary carries the building account's home directory"; exit 1;
          fi

  # The hermetic build for the platforms Nix runs on. `flake.lock` pins the
  # compiler, the linker, the C toolchain and every system library, so this
  # runner and any machine holding the same lock produce the same bytes;
  # `--rebuild` then builds a second time and refuses if the output differs.
  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v22
      - name: build
        run: |
          if [ -f flake.lock ]; then
            nix build --no-update-lock-file --print-build-logs .#kusanagi
          else
            nix flake lock
            nix build --print-build-logs .#kusanagi
          fi
          nix build --rebuild .#kusanagi
          sha256sum result/bin/kusanagi
          ./result/bin/kusanagi doctor --here --json --root "$RUNNER_TEMP/site" | grep '"binary"'
      - uses: actions/upload-artifact@v7
        with:
          name: flake-lock
          path: flake.lock

  # The GUI's own contract: the model a `.native` view binds must exist in Zig.
  #
  # **Not `native check`.** That walks every `src/**/*.native` and validates each
  # one as though it were a whole view, resolving its imports against the working
  # directory. The files under `src/components/` are fragments — they define
  # templates for `app.native` to compose, and one of them uses a template
  # another defines — so checking them in isolation asks a question none of them
  # is an answer to, and reports two errors about a tree that is correct. The
  # entry point is what ships, so the entry point is what is checked.
  glass:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: glass
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: install the native CLI
        run: npm install --global @native-sdk/cli@0.10.1
      - name: validate the manifest
        run: native validate app.json
      - name: check the view tree from its entry point
        run: native markup check src/app.native
      - name: test
        run: native test
