# The gate: what a change must pass before it can merge.
#
# Everything here is red for one reason only — **this change broke it**. That is
# the whole entry rule for this file. A job that can go red because a runner
# image moved, a registry was slow, or a half-built feature is still half-built
# does not belong here, because a red that has nothing to do with the change is
# a verdict on the contributor, and a lane that is usually red is a lane nobody
# reads.
#
# The slower and the environment-sensitive lanes live in `release-ready.yml`
# (which decides whether `main` can be tagged) and `sentinel.yml` (which watches
# for the world changing underneath us). `cargo deny` left this lane after one
# reset connection turned a network wobble into a failed check on somebody's
# change.
name: check

on:
  pull_request:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - name: format
        run: cargo fmt --all -- --check
      - name: lint
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: test
        run: cargo nextest run --workspace --all-features -E 'not package(kusanagi-grant)'
      # Where a test may stand, and what may follow it into a release. Bash and
      # `cargo tree` are all it needs, so it runs on every platform.
      - name: boxes
        shell: bash
        run: |
          outside=$(grep -rl 'CARGO_BIN_EXE' crates/ 2>/dev/null || true)
          [ -z "$outside" ] || { echo "::error::a Rust test drives the shipped binary: $outside"; exit 1; }
          for file in $(grep -rl --include='*.rs' '^mod tests' crates/*/src); do
            grep -q '#\[cfg(test)\]' "$file" || { echo "::error::$file compiles a test module into every build"; exit 1; }
          done
      # The line budget is an architectural rule, so it fails the build like any
      # other. `scripts/budget.sh` is the one authority: this job and `just budget`
      # used to carry two copies of the arithmetic and drift apart.
      - name: budget
        shell: bash
        run: bash scripts/budget.sh

  # The adversary compiles as part of the gate even though it never runs here.
  # Building it costs seconds and catches the one way this directory can break a
  # contributor who never opened it: a rename on the Rust side that the Lean
  # side names. Running it is `sentinel.yml`'s job, and needs the release binary.
  adversary-builds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: adversary
          build: "true"
          test: "false"
