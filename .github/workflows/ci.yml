# The fast lane: what a pull request must pass before anybody reads it.
#
# This is `just check` on two platforms, and only it. Everything slower or
# flakier — the third platform, the supply chain, the adversary, the GUI —
# runs on `main` and on the daily clock instead (see `full.yml`), because a
# red that has nothing to do with the change is a verdict on the contributor,
# and a ten-minute wait is a verdict on contributing at all. `cargo deny` left
# this lane after one reset connection turned a network wobble into a failed
# check on somebody's change.
name: check

on:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - name: format
        run: cargo fmt --all -- --check
      - name: lint
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: test
        run: cargo nextest run --workspace --all-features -E 'not package(kusanagi-grant)'
      # Where a test may stand, and what may follow it into a release. Bash and
      # `cargo tree` are all it needs, so it runs on every platform.
      - name: boxes
        shell: bash
        run: |
          outside=$(grep -rl 'CARGO_BIN_EXE' crates/ 2>/dev/null || true)
          [ -z "$outside" ] || { echo "::error::a Rust test drives the shipped binary: $outside"; exit 1; }
          for file in $(grep -rl --include='*.rs' '^mod tests' crates/*/src); do
            grep -q '#\[cfg(test)\]' "$file" || { echo "::error::$file compiles a test module into every build"; exit 1; }
          done
      # The line budget is an architectural rule, so it fails the build like any
      # other. `scripts/budget.sh` is the one authority: this job and `just budget`
      # used to carry two copies of the arithmetic and drift apart.
      - name: budget
        shell: bash
        run: bash scripts/budget.sh
