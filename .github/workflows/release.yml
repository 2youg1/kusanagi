# What a tag produces: one binary per platform and a checksum for each.
#
# Nothing here is signed. Until it is, the checksums prove that a download
# matches what this workflow built, and nothing more — say so in the release
# notes rather than letting a checksum imply provenance it does not have.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: build
        shell: bash
        run: |
          export RUSTFLAGS="$(bash scripts/hermetic.sh)"
          cargo build --release --locked --target ${{ matrix.target }}
      - name: package
        shell: bash
        run: |
          mkdir -p dist
          name="kusanagi-${{ github.ref_name }}-${{ matrix.target }}"
          if [ -f "target/${{ matrix.target }}/release/kusanagi.exe" ]; then
            cp "target/${{ matrix.target }}/release/kusanagi.exe" "dist/$name.exe"
            (cd dist && sha256sum "$name.exe" > "$name.exe.sha256")
          else
            cp "target/${{ matrix.target }}/release/kusanagi" "dist/$name"
            (cd dist && sha256sum "$name" > "$name.sha256")
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          prerelease: true
          generate_release_notes: true
