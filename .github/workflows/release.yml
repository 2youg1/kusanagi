# What a tag produces: one binary per platform and a checksum for each.
#
# Nothing here is signed. Until it is, the checksums prove that a download
# matches what this workflow built, and nothing more — say so in the release
# notes rather than letting a checksum imply provenance it does not have.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: build
        shell: bash
        run: |
          export RUSTFLAGS="$(bash scripts/hermetic.sh)"
          cargo build --release --locked --target ${{ matrix.target }}
      - name: package
        shell: bash
        run: |
          mkdir -p dist
          name="kusanagi-${{ github.ref_name }}-${{ matrix.target }}"
          if [ -f "target/${{ matrix.target }}/release/kusanagi.exe" ]; then
            cp "target/${{ matrix.target }}/release/kusanagi.exe" "dist/$name.exe"
            (cd dist && sha256sum "$name.exe" > "$name.exe.sha256")
          else
            cp "target/${{ matrix.target }}/release/kusanagi" "dist/$name"
            (cd dist && sha256sum "$name" > "$name.sha256")
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: dist/*

  publish:
    needs: [build, glass]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          prerelease: true
          generate_release_notes: true

  # The npm shell: no binaries here, only the version stamp. The platform
  # packages are packed from the release assets below; nothing is published
  # until a human runs the npm publish step by hand (see npm/README.md).
  npm-versions:
    needs: [publish]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: stamp the npm version from the tag
        shell: bash
        run: |
          tag="${{ github.ref_name }}"
          ver="${tag#v}"
          # v0.0.1prealpha -> 0.0.1-prealpha.0 ; v0.0.2 -> 0.0.2
          if [[ "$ver" == *prealpha ]]; then
            ver="${ver%prealpha}-prealpha.0"
          fi
          sed -i "s/0\.0\.0-placeholder/$ver/" npm/cli/package.json
          sed -i "s/0\.0\.1-prealpha\.0/$ver/" npm/cli/package.json
          sed -i "s/0\.0\.0-placeholder/$ver/" npm/platform-*/package.json
          grep -h '"version"' npm/cli/package.json npm/platform-*/package.json
      - uses: actions/upload-artifact@v7
        with:
          name: npm-dirs
          path: npm/

  # The windowed half, Windows only: it shells out to the CLI beside it, so
  # the same build produces both, and the zip carries the pair.
  glass:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: oven-sh/setup-bun@v2
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: install the native CLI
        run: npm install --global @native-sdk/cli
      - name: build the CLI beside the window
        shell: bash
        run: |
          export RUSTFLAGS="$(bash scripts/hermetic.sh)"
          cargo build --release --locked
          mkdir -p glass/zig-out/bin
          cp target/release/kusanagi.exe glass/zig-out/bin/kusanagi.exe
      - name: build the window
        run: native build glass -Dautomation=true -Dtrace=off
      - name: package
        shell: bash
        run: |
          mkdir -p dist
          name="kusanagi-${{ github.ref_name }}-glass-windows-x86_64"
          mkdir -p "dist/$name"
          cp glass/zig-out/bin/glass.exe "dist/$name/"
          cp glass/zig-out/bin/kusanagi.exe "dist/$name/"
          (cd dist && powershell -NoProfile -Command "Compress-Archive -Path \"$name\" -DestinationPath \"$name.zip\"" && sha256sum "$name.zip" > "$name.zip.sha256")
      - uses: actions/upload-artifact@v7
        with:
          name: glass-windows-x86_64
          path: dist/*
