# What a tag produces: one binary per platform and a checksum for each.
#
# Nothing here is signed. Until it is, the checksums prove that a download
# matches what this workflow built, and nothing more — say so in the release
# notes rather than letting a checksum imply provenance it does not have.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: build
        shell: bash
        run: |
          export RUSTFLAGS="$(bash scripts/hermetic.sh)"
          cargo build --release --locked --target ${{ matrix.target }}
      - name: package
        shell: bash
        run: |
          mkdir -p dist
          name="kusanagi-${{ github.ref_name }}-${{ matrix.target }}"
          if [ -f "target/${{ matrix.target }}/release/kusanagi.exe" ]; then
            asset="$name.exe"
            cp "target/${{ matrix.target }}/release/kusanagi.exe" "dist/$asset"
          else
            asset="$name"
            cp "target/${{ matrix.target }}/release/kusanagi" "dist/$asset"
          fi
          (cd dist && sha256sum "$asset" > "$asset.sha256")
          # What the release page will say about this artefact, recorded by the
          # only machine that can speak for it. The BLAKE3 comes from the binary
          # itself, which is the hash `kusanagi doctor --here` prints for a
          # reader, so the table on the release page and that command answer one
          # question with one number.
          hash="$("./dist/$asset" doctor --here --json --root "$RUNNER_TEMP/notes-site" \
            | tr ',' '\n' | sed -ne 's/.*"binary": *"\([0-9a-f]*\)".*/\1/p')"
          if [ -z "$hash" ]; then
            echo "::error::the built binary reported no BLAKE3 of itself"; exit 1
          fi
          {
            echo "asset=$asset"
            echo "blake3=$hash"
            echo "rustc=$(rustc --version)"
            echo "image=${ImageOS:-unknown} ${ImageVersion:-unknown}"
          } > "dist/$asset.facts"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: dist/*

  publish:
    needs: [build, glass]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      # The body of the release page. GitHub's generated half lists the pull
      # requests merged since the last tag and the contributors who were new
      # among them; the authored half carries install, the hashes and the
      # toolchain, and it is composed from the `.facts` files the build jobs
      # wrote rather than by hand after the fact.
      - name: compose the release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f tag_name="${GITHUB_REF_NAME}" -q .body > "$RUNNER_TEMP/generated.md"
          bash scripts/release-notes.sh "${GITHUB_REF_NAME}" dist "$RUNNER_TEMP/generated.md" \
            > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*
            !dist/*.facts
          prerelease: true
          body_path: ${{ runner.temp }}/notes.md

  # The npm channel: the same binaries the release page carries, wrapped so a
  # machine that already has node or bun reaches them with one command. The
  # platform packages go first and the shell last, because the shell pins them
  # as optional dependencies at an exact version, and a pin the registry cannot
  # resolve is an install that fails on somebody else's machine.
  #
  # The first version of each package name cannot come from here — npm requires
  # a package to exist before its settings accept a trusted publisher, so a
  # person publishes each name once by hand (npm/README.md) and CI owns every
  # version after that.
  npm:
    needs: [publish]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Trusted publishing: npm exchanges this OIDC token for a short-lived
      # credential, so no npm token is stored, and each version gets a
      # provenance attestation naming the run that built it.
      id-token: write
    env:
      # Every release so far is a prerelease, so `latest` is simply the newest
      # build a user should get, and npm refuses a prerelease that names no
      # dist-tag. A stable line would change this value here and nowhere else.
      DIST_TAG: latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: trusted publishing needs npm 11.5.1 or newer
        run: |
          npm install --global npm@latest
          npm --version
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: pack the built binaries into the npm tree
        id: pack
        shell: bash
        run: |
          version="$(bash scripts/npm-pack.sh '${{ github.ref_name }}' dist out/npm)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: publish the platform packages
        run: |
          for dir in out/npm/platform-*; do
            npm publish "$dir" --tag "$DIST_TAG"
          done
      - name: wait until the registry serves every pin
        shell: bash
        run: |
          version='${{ steps.pack.outputs.version }}'
          # The packed tree is the only list of platform packages there is, so a
          # target added to npm-pack.sh is waited for here without a second edit.
          for dir in out/npm/platform-*; do
            package="$(npm pkg get name --prefix "$dir" | tr -d '"')"
            for attempt in $(seq 1 10); do
              if npm view "$package@$version" version >/dev/null 2>&1; then
                break
              fi
              if [ "$attempt" -eq 10 ]; then
                echo "$package@$version is still unresolvable; the shell would install broken" >&2
                exit 1
              fi
              sleep 6
            done
          done
      - name: publish the shell
        run: npm publish out/npm/cli --tag "$DIST_TAG"

  # The windowed half, Windows only: it shells out to the CLI beside it, so
  # the same build produces both, and the zip carries the pair.
  glass:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: oven-sh/setup-bun@v2
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: install the native CLI
        run: npm install --global @native-sdk/cli@0.10.1
      - name: show the native version
        run: native --version
      - name: build the CLI beside the window
        shell: bash
        run: |
          export RUSTFLAGS="$(bash scripts/hermetic.sh)"
          cargo build --release --locked
          mkdir -p glass/zig-out/bin
          cp target/release/kusanagi.exe glass/zig-out/bin/kusanagi.exe
      - name: build the window
        run: native build glass -Dautomation=true -Dtrace=off
      - name: package
        shell: bash
        run: |
          mkdir -p dist
          name="kusanagi-${{ github.ref_name }}-glass-windows-x86_64"
          mkdir -p "dist/$name"
          cp glass/zig-out/bin/glass.exe "dist/$name/"
          cp glass/zig-out/bin/kusanagi.exe "dist/$name/"
          (cd dist && powershell -NoProfile -Command "Compress-Archive -Path \"$name\" -DestinationPath \"$name.zip\"" && sha256sum "$name.zip" > "$name.zip.sha256")
          # No `blake3=` line: an archive cannot report a hash of itself, and the
          # release notes say so rather than leaving a reader to wonder why one
          # row of the table is absent.
          {
            echo "asset=$name.zip"
            echo "rustc=$(rustc --version)"
            echo "image=${ImageOS:-unknown} ${ImageVersion:-unknown}"
          } > "dist/$name.zip.facts"
      - uses: actions/upload-artifact@v7
        with:
          name: glass-windows-x86_64
          path: dist/*
