# Everything about a build that would otherwise depend on where it happened.
#
# `just dist` prints a hash, and a hash of a file only says "this file is this
# file" unless the same source produces the same file on somebody else's
# machine. Two things stop it doing so by default: absolute paths compiled into
# the binary, and incremental state carried between builds.
#
# **The paths are not handled here, and that is deliberate.** `rustc` records
# the file name of everything it compiles so that a panic can name a line, and
# those names include the checkout directory, the registry cache and the
# toolchain — all of which differ per machine and per account. Remapping them
# takes `--remap-path-prefix`, and cargo does not expand `$CARGO_HOME` or any
# other variable inside this file, so a remap written here matched nothing and
# the binary carried the building account's name. The flags are computed by
# `scripts/hermetic.sh`, which the release recipes and CI pass as `RUSTFLAGS`;
# an ordinary `cargo build` does not pay for them and does not need to.
#
# What no flag can pin is the linker. On Windows the release artefact is
# `x86_64-pc-windows-msvc`, so `link.exe` and the Windows SDK decide part of the
# output, and their versions are recorded by hand at release time —
# `docs/VERIFY.md` says where. `/Brepro`, which asks the linker to leave out its
# timestamp, travels with the other flags in that script.

[profile.release]
# Nothing is carried between builds, so nothing about the previous one can reach
# this one. Off by default for release, and stated here because a reproducible
# build is not allowed to rest on a default.
incremental = false
# No debug information at all, which removes both the largest source of embedded
# paths and the largest source of per-build variation.
debug = 0
