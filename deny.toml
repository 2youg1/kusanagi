# cargo-deny: what may enter the binary this project ships.
#
# Run `cargo deny check` in CI and before a release. The point is not tidiness —
# a supply chain is the one part of this design that no amount of cryptography
# defends, so the set of crates that can reach a user is written down and gated.

[graph]
all-features = true

[advisories]
# A known vulnerability stops a release. There is no severity threshold below
# which shipping one is acceptable in a project that claims to carry secrets.
yanked = "deny"
ignore = []

[licenses]
# Permissive only. A copyleft dependency would reach further than MPL-2.0's
# file-level reciprocity and would change what a user of the binary is agreeing
# to, which is not a decision a transitive dependency gets to make.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "CC0-1.0",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
    # `webpki-roots` ships Mozilla's CA certificate set, which is data rather
    # than code and carries a permissive data licence. It reaches the binary
    # because an S3 bucket is HTTPS.
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[licenses.private]
# The workspace's own crates are MPL-2.0 and are not published from here yet.
ignore = true

[bans]
# Two versions of one crate in one binary is usually an unnoticed duplicate.
multiple-versions = "warn"
wildcards = "deny"
# `unsafe_code = "forbid"` covers our own crates; these are the ones whose
# absence keeps the binary small and the failure modes few.
deny = [
    { name = "openssl-sys", reason = "no C toolchain in the build; rustls is the TLS in use" },
    { name = "tokio", reason = "every verb is a one-shot command; an async runtime has nothing to do here" },
    { name = "chrono", reason = "the only date arithmetic is one timestamp format, written out in waypoint::s3" },
    { name = "hex", reason = "the network has one text encoding, defined in kernel::wire" },
    { name = "hkdf", reason = "BLAKE3's derive_key mode is the one key derivation here" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
